html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}

body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;margin:0;font-weight:600}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:18px 24px 8px}
header h1{font-size:30px;letter-spacing:.5px}
header p{margin:0;color:var(--mut);font-size:14px}
.warn{margin:6px 24px 0;padding:8px 12px;background:var(--warnb);color:var(--ink);border-left:3px solid var(--warn);font-size:13px}
nav{display:flex;gap:4px;padding:14px 24px 0;border-bottom:1px solid var(--line);overflow-x:auto}

button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:20px 24px 40px;max-width:1100px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:4px}
input{flex:1;min-width:200px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
td small{display:block;color:var(--mut)}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.Vigente{background:var(--okb);color:var(--ok)}.Revogada{background:var(--badb);color:var(--bad)}.Emanálise{background:var(--blub);color:var(--acc)}
.Alto{background:var(--badb);color:var(--bad)}.Médio{background:var(--warnb);color:var(--warn)}.Baixo{background:var(--okb);color:var(--ok)}
.Emandamento{background:var(--blub);color:var(--acc)}.Concluído{background:var(--okb);color:var(--ok)}.Pendente{background:var(--warnb);color:var(--warn)}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;padding:0;list-style:none;font-size:13px;color:var(--mut)}
.steps li{background:var(--panel);border:1px solid var(--line);padding:6px 10px}
.rep{background:var(--panel);border:1px solid var(--line);padding:22px 26px;max-width:820px}
.rep h2{font-size:24px;margin-bottom:4px}
.rep h3{font-size:17px;margin:22px 0 6px}
.rep p,.rep ul{margin:4px 0}.rep ul{padding-left:20px}
.meta{color:var(--mut);font-size:14px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:6px}
.ba div{background:var(--panel);padding:8px 10px;font-size:14px}.ba b{display:block;font-size:12px;color:var(--mut)}
.val{margin-top:22px;padding:10px 12px;background:var(--bg);font-size:13px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.val button{font:inherit;padding:6px 12px;border:1px solid var(--acc);background:var(--acc);color:var(--panel);border-radius:4px;cursor:pointer}
.feed{list-style:none;margin:0;padding:0;max-width:820px}
.feed li{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);padding:12px 16px;margin-bottom:10px}
.feed li.empty{border-left-color:var(--line);color:var(--mut)}
.feed b{font-family:Newsreader,Georgia,serif;font-size:17px}
svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line)}
svg text{fill:var(--ink);font:12px "Public Sans",sans-serif}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mut);margin:10px 0}
@media (max-width:600px){header,main,nav{padding-left:14px;padding-right:14px}.warn{margin-left:14px;margin-right:14px}.rep{padding:16px}.ba{grid-template-columns:1fr}}
</style>
