name: Atualizar REGULATECA
on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 06:00 (horário de Brasília)
  workflow_dispatch:       # permite rodar manualmente pelo botão "Run workflow"
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests
      - name: Coletar pautas, atas e extratos novos
        run: python coletor.py
      - name: Ler documentos e gerar dados do painel
        run: python regulateca_leitor.py pdfs docs --json
      - name: Salvar resultados no repositório
        run: |
          git config user.name "regulateca-bot"
          git config user.email "regulateca-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Atualização automática" && git push)
